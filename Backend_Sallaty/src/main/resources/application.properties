# ═══════════════════════════════════════════════
#  APPLICATION
# ═══════════════════════════════════════════════
spring.application.name=Sallaty

# ═══════════════════════════════════════════════
#  DATABASE
# ═══════════════════════════════════════════════
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=1
spring.datasource.driver-class-name=

# ═══════════════════════════════════════════════
#  JPA / HIBERNATE
# ═══════════════════════════════════════════════
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ═══════════════════════════════════════════════
#  SERVER
# ═══════════════════════════════════════════════
server.port=8080
server.address=0.0.0.0

# ═══════════════════════════════════════════════
#  JWT
# ═══════════════════════════════════════════════
jwt.secret=JWT_SECRET:sallaty_secret_key_2024_very_long_string
jwt.access.minutes=1440
jwt.refresh.days=7

# ═══════════════════════════════════════════════
#  COMMISSION
# ═══════════════════════════════════════════════
app.platform.commission-rate=0.10
app.transport.base-cost=1.50

# ═══════════════════════════════════════════════
#  FILE STORAGE
# ═══════════════════════════════════════════════
app.upload.dir=${UPLOAD_DIR:uploads/}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ═══════════════════════════════════════════════
#  TWILIO — OTP SMS
# ═══════════════════════════════════════════════
twilio.account.sid=
twilio.auth.token=
twilio.phone.number=
# ═══════════════════════════════════════════════
#  MAIL — OTP EMAIL
# ═══════════════════════════════════════════════
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=
spring.mail.properties.mail.smtp.starttls.required=
spring.mail.properties.mail.smtp.ssl.trust=
spring.mail.properties.mail.smtp.ssl.enable=

# ═══════════════════════════════════════════════
#  FIREBASE
# ═══════════════════════════════════════════════
firebase.config.path=src/main/resources/firebase-service-account.json


spring.web.resources.static-locations=file:uploads/


name: saallatyy
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation & UI
  curved_navigation_bar: ^1.0.6
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.2
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Network
  http: ^1.2.0
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # Auth
  google_sign_in: ^6.2.1

  # Media
  image_picker: ^1.0.4
  record: ^6.0.0
  audioplayers: ^6.0.0

  # Files & Permissions
  path_provider: ^2.0.0
  permission_handler: ^11.0.0
  stomp_dart_client: 3.0.1
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
  generate: true
  uses-material-design: true